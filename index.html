<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A tiny, private web chat for local Ollama models.">
  <meta name="theme-color" content="#08110f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <title>Chat Lite for Ollama</title>
</head>
<body>
  <main class="app">
    <header>
      <div class="mark" aria-hidden="true">C</div>
      <div class="title">
        <h1>Chat Lite for Ollama</h1>
        <div class="subtitle">Private chat for local models</div>
      </div>
      <div id="status" class="status" role="status"><span class="dot"></span><span>Connecting</span></div>
      <div class="toolbar">
        <label class="field model-field">
          <span>Model</span>
          <select id="model" aria-label="Model"></select>
        </label>
        <label class="reasoning" title="Thinking is unavailable for this model">
          <span>Thinking</span>
          <select id="reasoning" aria-label="Thinking" disabled>
            <option value="false">Off</option>
          </select>
        </label>
        <label class="answer-style" title="Choose the preferred response length and depth">
          <span>Answer</span>
          <select id="answer-style" aria-label="Answer style">
            <option value="concise">Concise</option>
            <option value="balanced" selected>Balanced</option>
            <option value="detailed">Detailed</option>
          </select>
        </label>
        <button id="clear" class="ghost" type="button">New chat</button>
      </div>
    </header>

    <section id="messages" aria-label="Conversation"></section>

    <div class="composer-wrap">
      <form id="composer" class="composer">
        <textarea id="prompt" rows="1" placeholder="Message the local model…" aria-label="Message"></textarea>
        <button id="send" class="send" type="submit" aria-label="Send message" title="Send message">↑</button>
      </form>
      <div class="hint">Enter to send · Shift+Enter for a new line · Chat history stays in this browser</div>
      <div id="history-notice" class="notice" role="status" aria-live="polite"></div>
    </div>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
