name: Container check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build --tag chat-lite-for-ollama:test .
      - name: Start container
        run: >-
          docker run --detach
          --name chat-lite-for-ollama-test
          --publish 127.0.0.1:18080:8080
          --add-host host.docker.internal:host-gateway
          chat-lite-for-ollama:test
      - name: Check health endpoint
        run: curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:18080/health
      - name: Show logs on failure
        if: failure()
        run: docker logs chat-lite-for-ollama-test || true
      - name: Stop container
        if: always()
        run: docker rm --force chat-lite-for-ollama-test 2>/dev/null || true
